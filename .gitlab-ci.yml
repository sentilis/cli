# GitLab CI/CD for @sentilis/cli
#
# This package ships two things from one tree: the `sentilis` binary
# (src/, Node APIs allowed) and the isomorphic SDK (src/sdk/, published as
# the "." and "./press|market|bio|workspace|node" subpaths). The SDK is
# bundled into the Obsidian plugin, which runs on mobile, so keeping Node
# code out of it is a release-blocking invariant, not a style preference.
#
# Pipelines:
#   • Every push to main and every MR → `build` job type-checks, compiles,
#     enforces the SDK boundary, and smoke-tests the CLI across the
#     supported Node matrix.
#   • Tag push matching `v*` (e.g. v2.0.1) → `publish` job pushes to npm.
#     Prerelease tags (v2.0.0-rc.1) publish under the `next` dist-tag so
#     they never move `latest`.
#
# Required CI/CD variables (Project → Settings → CI/CD → Variables):
#   • NPM_TOKEN — npm automation token with publish rights. Mark "Masked"
#     and "Protected" (only exposed to protected branches/tags).

stages:
  - build
  - publish

default:
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm install --no-audit --no-fund --cache .npm --prefer-offline

# ────────────────────────────────────────────────────────────────
# Build matrix: validate the package against every supported Node.
# ────────────────────────────────────────────────────────────────
build:
  stage: build
  parallel:
    matrix:
      - NODE_VERSION: ["18", "20", "22"]
  image: node:${NODE_VERSION}-alpine
  script:
    - node --version
    - npm run build
    - |
      echo "Type-checking the SDK subtree with no Node types…"
      npm run check:sdk
    - |
      echo "Checking the SDK boundary in dist/…"
      npm run check:dist
    - |
      echo "Smoke-testing CLI…"
      node dist/index.js --help > /dev/null
      node dist/index.js auth   --help > /dev/null
      node dist/index.js bio    --help > /dev/null
      node dist/index.js press  --help > /dev/null
      node dist/index.js market --help > /dev/null
      node dist/index.js sync   --help > /dev/null
      echo "OK — all subcommands respond"
    - |
      echo "Dry-running the bundled examples…"
      # No auth needed: every push command returns from its --dry-run
      # branch before it reaches requireAuth(). These fixtures exercise
      # the whole parse/validate/walk surface, which is what an import
      # rewrite is most likely to silently mis-wire.
      node dist/index.js bio    push examples/personal-brand/bio                       --dry-run > /dev/null
      node dist/index.js bio    push examples/entrepreneur/bio                         --dry-run > /dev/null
      node dist/index.js press  push examples/entrepreneur/press/funding-round         --dry-run > /dev/null
      node dist/index.js press  push examples/personal-brand/press/productivity-tools  --dry-run > /dev/null
      node dist/index.js market push examples/entrepreneur/market/pitch-deck           --dry-run > /dev/null
      node dist/index.js market push examples/personal-brand/market/coaching-session   --dry-run > /dev/null
      node dist/index.js sync        examples/entrepreneur                             --dry-run > /dev/null
      node dist/index.js sync        examples/personal-brand                           --dry-run > /dev/null
      echo "OK — fixtures validate"
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - dist/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ────────────────────────────────────────────────────────────────
# Publish: runs only on `v*` tag pushes. Reuses the Node 22 artifact
# from the build stage and validates that package.json matches the tag.
# `prepublishOnly` re-runs the full verify before the tarball is cut.
# ────────────────────────────────────────────────────────────────
publish:
  stage: publish
  needs:
    - job: build
      parallel:
        matrix:
          - NODE_VERSION: "22"
      artifacts: true
  script:
    - |
      PKG_VERSION=$(node -p "require('./package.json').version")
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
        echo "ERROR: package.json version ($PKG_VERSION) does not match tag (v$TAG_VERSION)"
        exit 1
      fi
      case "$TAG_VERSION" in
        *-*) NPM_TAG="next" ;;
        *)   NPM_TAG="latest" ;;
      esac
      echo "Publishing $PKG_VERSION under dist-tag $NPM_TAG"

      # The registry answers 404 — not 401 or 403 — to a publish it will not
      # authorize, so a missing or dead credential is indistinguishable from
      # "this package does not exist". Diagnose it here, before npm gets the
      # chance to report the wrong thing.
      if [ -z "${NPM_TOKEN:-}" ]; then
        echo "ERROR: NPM_TOKEN is empty in this job."
        echo
        echo "If the variable is marked Protected, GitLab only exposes it to"
        echo "pipelines on protected branches and protected TAGS. A release tag"
        echo "that is not covered by a protected-tag rule gets an empty value."
        echo "Fix by either:"
        echo "  • adding a protected-tag rule for v*"
        echo "    (Settings -> Repository -> Protected tags), or"
        echo "  • clearing the Protected flag on the variable"
        echo "    (Settings -> CI/CD -> Variables)."
        exit 1
      fi

      echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      if ! NPM_USER=$(npm whoami 2>&1); then
        echo "ERROR: the registry rejected NPM_TOKEN."
        echo "  $NPM_USER"
        echo
        echo "The token is expired, revoked, or lacks write access. Issue a new"
        echo "one with read-write rights on the @sentilis scope. Note that npm"
        echo "granular tokens expire (90 days maximum) while classic automation"
        echo "tokens do not — an automation token is the low-maintenance choice"
        echo "for CI, and npm trusted publishing (OIDC) removes the long-lived"
        echo "secret altogether."
        exit 1
      fi

      echo "Authenticated to npm as $NPM_USER"
      npm publish --access public --tag "$NPM_TAG"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[\w.]+)?$/

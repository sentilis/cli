# GitLab CI/CD for @sentilis/cli
#
# Pipelines:
#   • Every push to main and every MR → `build` job runs the type-check,
#     compiles the CLI, and smoke-tests it across the supported Node matrix.
#   • Tag push matching `v*` (e.g. v0.5.1) → `publish` job pushes to npm.
#
# Local-dev vs. CI dependency on @sentilis/core:
#   • In package.json, "@sentilis/core" is "file:../sentilis.core" for a
#     seamless DX when both repos are siblings on disk.
#   • In CI the sibling does not exist, so before install we rewrite the
#     reference to a published version range (SENTILIS_CORE_VERSION).
#     This also guarantees the published @sentilis/cli tarball points at
#     the registry, not a file path.
#
# Required CI/CD variables (Project → Settings → CI/CD → Variables):
#   • NPM_TOKEN — npm automation token with publish rights. Mark "Masked"
#     and "Protected" (only exposed to protected branches/tags).

variables:
  SENTILIS_CORE_VERSION: "^0.5.0"

stages:
  - build
  - publish

default:
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm pkg set "dependencies.@sentilis/core=${SENTILIS_CORE_VERSION}"
    - npm install --no-audit --no-fund --cache .npm --prefer-offline

# ────────────────────────────────────────────────────────────────
# Build matrix: validate the CLI against every supported Node.
# ────────────────────────────────────────────────────────────────
build:
  stage: build
  parallel:
    matrix:
      - NODE_VERSION: ["18", "20", "22"]
  image: node:${NODE_VERSION}-alpine
  script:
    - node --version
    - npm run build
    - |
      echo "Smoke-testing CLI…"
      node dist/index.js --help > /dev/null
      node dist/index.js market --help > /dev/null
      node dist/index.js press  --help > /dev/null
      node dist/index.js bio    --help > /dev/null
      node dist/index.js auth   --help > /dev/null
      echo "OK — all subcommands respond"
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - dist/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ────────────────────────────────────────────────────────────────
# Publish: runs only on `v*` tag pushes. Reuses the Node 22 artifact
# from the build stage and validates that package.json matches the tag.
# ────────────────────────────────────────────────────────────────
publish:
  stage: publish
  needs:
    - job: build
      parallel:
        matrix:
          - NODE_VERSION: "22"
      artifacts: true
  script:
    - |
      PKG_VERSION=$(node -p "require('./package.json').version")
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
        echo "ERROR: package.json version ($PKG_VERSION) does not match tag (v$TAG_VERSION)"
        exit 1
      fi
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - npm publish --access public
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[\w.]+)?$/
